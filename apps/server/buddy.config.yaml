# buddy-on behavior config (loaded + validated at startup).
# Secrets/infra (DB, RabbitMQ, Ollama URL, JWT, ports) stay in .env.
# Override the path with the BUDDY_CONFIG env var. Relative source paths are
# resolved against this file's directory.

generation:
  model: gemma4:e4b        # single generation model (Ollama tag); e4b on CPU, 26b on GPU
  temperature: 0.1

retrieval:
  mode: hybrid             # vector | lexical | hybrid
  topK: 5
  minScore: 0.35           # cosine gate for the vector arm
  expandQuery: true        # LLM keyword expansion to feed the lexical arm (bridges NL <-> code)

# Sources indexed into pgvector. type is informational (chunker routes by extension).
sources:
  - collection: handbook
    type: docs
    path: ../../sample-docs
  # - collection: sk-tours
  #   type: code
  #   path: /absolute/path/to/repo

reindex:
  onStartup: true          # ensure non-empty index before serving; refresh on boot
  cron: "0 3 * * *"        # daily incremental re-index (omit to disable)

prompts:
  system: |
    You are a first-line support assistant for end users — customers, managers and support agents who have NO access to the source code or internal docs.
    Use ONLY the information in the provided context, but answer as if you simply know the product:
    - Write a self-contained answer in plain language, in the same language as the question.
    - For "how to" questions, give a short numbered list of concrete actions the user should take.
    - NEVER mention file names, file paths, code, functions, README, "the documentation" or "the context". Don't show code unless the user explicitly asks for a snippet.
    - If the context does not contain the answer, say you don't have that information and suggest contacting human support. Never invent details.
    - Be concise and practical.
