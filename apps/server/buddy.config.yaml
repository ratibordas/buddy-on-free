# buddy-on behavior config (loaded + validated at startup).
# Secrets/infra (DB, RabbitMQ, Ollama URL, JWT, ports) stay in .env.
# Override the path with the BUDDY_CONFIG env var. Relative source paths are
# resolved against this file's directory.

generation:
  model: gemma4:12b        # serving model — fast on 16GB. (26b offloads/slow here; use it for docgen, not serving)
  temperature: 0.1
  think: false             # Gemma 4 reasoning mode; off for grounded QA (faster, avoids empty answers under token cap)

retrieval:
  mode: hybrid             # vector | lexical | hybrid
  topK: 5
  minScore: 0.35           # cosine gate for the vector arm
  # Speed <-> quality preset (sets the LLM-pass flags below). Chat calls per question:
  #   fast (1) | balanced (2) | quality (3) | max (3 + agentic loop) | custom (use flags below)
  profile: balanced
  # Used only when profile: custom
  expandQuery: true        # LLM keyword expansion to feed the lexical arm (bridges NL <-> code)
  agentic: false           # ReAct loop; needs a strong model (Tier 2+), not 12B
  groundingCheck: true     # post-answer faithfulness check; decline if unsupported (anti-hallucination)

# Structural/graph provider chosen by language (a source's own `structural` overrides).
#   goda | gograph -> Go   |   codebase-memory -> TS/JS (polyglot)   |   none
structuralByLanguage:
  go: goda
  typescript: codebase-memory
  javascript: codebase-memory

# Sources indexed into pgvector. How each is chunked:
#   docs        -> local markdown files, heading-aware chunker (PRIMARY use case)
#   notion      -> Notion pages via API, blocks -> markdown  (token in .env: NOTION_TOKEN)
#   confluence  -> Confluence space via API, storage HTML -> text (creds in .env: CONFLUENCE_*)
#   code        -> local code; AST chunks for go/ts/tsx/js/jsx/python, else fallback chunker
sources:
  - collection: handbook
    type: docs
    path: ../../sample-docs
  # --- Remote documentation (the main use case: index docs, answer questions) ---
  # - collection: notion
  #   type: notion
  #   database: <notion-database-id>   # omit to index every page shared with the integration
  # - collection: wiki
  #   type: confluence
  #   space: ENG                       # omit to index every space the token can read
  # --- Code (secondary: for verification / symptom->mechanism via generated docs) ---
  # - collection: crm-api
  #   type: code
  #   language: go            # -> structural: goda (via structuralByLanguage)
  #   path: /absolute/path/to/go-repo
  # - collection: crm-front
  #   type: code
  #   language: typescript    # -> structural: codebase-memory
  #   path: /absolute/path/to/ts-repo

reindex:
  onStartup: true          # ensure non-empty index before serving; refresh on boot
  cron: "0 3 * * *"        # daily incremental re-index (omit to disable)

prompts:
  system: |
    You are a first-line support assistant for end users — customers, managers and support agents who have NO access to the source code or internal docs.
    Use ONLY the information in the provided context, but answer as if you simply know the product:
    - Write a self-contained answer in plain language, in the same language as the question.
    - For "how to" questions, give a short numbered list of concrete actions the user should take.
    - NEVER mention file names, file paths, code, functions, README, "the documentation" or "the context". Don't show code unless the user explicitly asks for a snippet.
    - If the context does not contain the answer, say you don't have that information and suggest contacting human support. Never invent details.
    - Be concise and practical.
